[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperzero"
version = "0.1.0"
description = "A lightweight chess engine growing toward a Stockfish-style architecture"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
nnue = ["numpy>=2.0", "python-chess>=1.11", "zstandard>=0.22"]

[project.scripts]
paperzero = "paperzero_engine.uci:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["paperzero_engine*"]
